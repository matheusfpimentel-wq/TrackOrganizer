[package]
name = "tracklistr"
version = "0.1.0"
description = "Tracklistr - DJ music library metadata organizer"
authors = ["Tracklistr"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tracklistr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
walkdir = "2"
rayon = "1"
quick-xml = "0.36"
symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "isomp4", "flac", "pcm", "vorbis", "ogg"] }
rustfft = "6"
rusty-chromaprint = "0.3"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
